<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<body>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        .container{
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: gray;
            display: flex;
            text-align: center;
        }
        .box{
            width: 300px;
            height: 400px;
            background-color: bisque;
            border: 0;
            border-radius: 16px;
        }
        .title{
            padding-top: 40px;
            font-size: 1.7rem;

        }
        .txt{
            padding-top: 20px;
            padding: 20px;
        }
        .input{
            padding-top: 30px;
            width: 240px;
            height: 80px;
        }

    </style>
    <div class="container">
        <div class="box">
            <div class="title">About</div>
            <div class="txt">
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Sapiente assumenda possimus hic reiciendis. Quasi excepturi explicabo saepe tempora nesciunt nemo maxime fugit quibusdam libero sapiente quaerat, omnis harum cupiditate optio.
                </p>
                <div class="input">
                    <input type="text" placeholder="recoment to my wb">
                    <button>Submite</button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
